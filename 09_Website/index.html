<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Al Deafah Homepage</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap">
<style>/* AlDeafah International Group — web tokens. Source: Design System tokens.json (Brand Facts §Palette + approved UI sets).
   Latin: Avenir Next (manual) — web licence unknown, so Arial is the declared fallback. Arabic: Almarai (OFL) — closest open match to the logo wordmark (decision 2026-10-14). */
:root {
  /* official palette */
  --deafah-black:#101820; --deafah-grey:#B6ADA5; --deafah-yellow:#D29F13;
  --deafah-dark-blue:#0E4174; --deafah-blue:#008BC4; --deafah-dark-green:#13322B;
  --deafah-green:#8DAE81; --deafah-dark-red:#C10016; --deafah-beige:#E1B87F;
  --gold-gradient-start:#D6AA42; --gold-gradient-end:#8E732A; --gold-solid:#BC9639;
  /* UI set — light */
  --surface:#FFFFFF; --surface-raised:#F5F2EE; --ink:#101820; --ink-muted:#5C5853;
  --accent:#8E732A; --on-accent:#FFFFFF; --border:#B6ADA5;
  --pattern-ink:#8E732A; --pattern-opacity:.25;
  --show-light:block; --show-dark:none;
  /* type */
  --font-latin:"Avenir Next", Avenir, Arial, sans-serif; --font-arabic:"Almarai", Arial, sans-serif;
  --display:48px/52px; --ar-display:48px/64px; --headline:24px/30px; --ar-headline:24px/36px; --body:16px/22px; --ar-body:16px/28px; --label:12px/16px;
  /* spacing & radius */
  --space-1:4px; --space-2:8px; --space-4:16px; --space-8:32px; --space-16:64px; --radius:12px; --radius-0:0; --radius-sm:12px; /* 2026-10-29: 12 px standard; --radius-0 kept only for edge-to-edge surfaces */
  --motion:200ms;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --surface:#101820; --surface-raised:#1C242E; --ink:#FFFFFF; --ink-muted:#B6ADA5;
  --accent:#D29F13; --on-accent:#101820; --border:#3A4350; --pattern-ink:#D6AA42;
  --show-light:none; --show-dark:block; color-scheme:dark } }
:root[data-theme="dark"] {
  --surface:#101820; --surface-raised:#1C242E; --ink:#FFFFFF; --ink-muted:#B6ADA5;
  --accent:#D29F13; --on-accent:#101820; --border:#3A4350; --pattern-ink:#D6AA42;
  --show-light:none; --show-dark:block; color-scheme:dark }

html{scroll-behavior:smooth} body{margin:0;background:var(--surface);color:var(--ink);font:var(--body) var(--font-latin)}
[dir=rtl] body, body[dir=rtl], .ar{font-family:var(--font-arabic)}
*{box-sizing:border-box} img,svg{max-width:100%} a{color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.only-light{display:var(--show-light)!important} .only-dark{display:var(--show-dark)!important}
html[dir=ltr] .rtl-only,html[dir=rtl] .ltr-only{display:none!important}
/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--surface);border-bottom:1px solid var(--border);z-index:5}
.nav .wrap{display:flex;align-items:center;gap:var(--space-8);min-height:72px;padding-block:var(--space-2)}
.nav .logo svg{height:44px;width:auto;display:block}
.nav ul{display:flex;gap:var(--space-4);list-style:none;margin:0;padding:0;flex:1;flex-wrap:wrap}
.nav a{text-decoration:none;font-weight:500;padding:var(--space-2) 0;border-bottom:2px solid transparent;transition:border-color var(--motion)}
.nav a:hover,.nav a:focus-visible{border-bottom-color:var(--accent);outline:none}
.tools{display:flex;gap:var(--space-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);padding:12px 24px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font:inherit;font-weight:600;border-radius:var(--radius);cursor:pointer;text-decoration:none;transition:background var(--motion),color var(--motion),border-color var(--motion)}
.btn:hover{filter:brightness(1.08)} .btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.btn.secondary{background:transparent;color:var(--ink);border-color:var(--deafah-grey)} .btn.secondary:hover{border-color:var(--accent);color:var(--accent);filter:none}
.btn.small{padding:6px 12px;font-size:14px}
/* hero: always Deafah Black (the signage/envelope ground) — logo NEG */
.hero{background:var(--deafah-black);color:#FFFFFF;border-bottom:1px solid var(--border)}
.hero .wrap{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-16);align-items:center;padding-block:var(--space-16)}
.hero .logo svg{width:min(320px,70%);height:auto;display:block;margin-inline:auto}
.hero h1{font:var(--display) var(--font-latin);font-weight:400;margin:0 0 var(--space-4);text-wrap:balance}
[dir=rtl] .hero h1{font:var(--ar-display) var(--font-arabic);font-weight:700;font-size:40px;line-height:56px}
.hero p{color:var(--deafah-grey);max-width:38em;margin:0 0 var(--space-8)}
.hero .btn{background:var(--deafah-yellow);border-color:var(--deafah-yellow);color:var(--deafah-black)}
.hero .btn.secondary{background:transparent;color:#FFFFFF;border-color:var(--deafah-grey)}
.eyebrow{font:var(--label) var(--font-latin);font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 var(--space-2)}
[dir=rtl] .eyebrow{font-family:var(--font-arabic);letter-spacing:0}
.hero .eyebrow{color:var(--deafah-yellow)}
/* sections */
section{padding-block:var(--space-16)} h2{font:var(--headline) var(--font-latin);font-weight:400;font-size:32px;line-height:40px;margin:0 0 var(--space-8);text-wrap:balance}
[dir=rtl] h2{font-family:var(--font-arabic);font-weight:700;font-size:28px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-4)}
.card{background:var(--surface-raised);padding:var(--space-8) var(--space-4);border-radius:var(--radius);min-width:0;transition:transform var(--motion)}
.card:hover{transform:translateY(-2px)}
.card svg{height:40px;width:auto;display:block;margin-bottom:var(--space-4)}
.card h3{margin:0 0 var(--space-1);font-size:20px;line-height:26px;font-weight:600} .card .ar-name{color:var(--accent);font-family:var(--font-arabic);margin:0 0 var(--space-2)}
.card p{margin:0;color:var(--ink-muted)}
/* pattern strip: whole 2x2 blocks, never cut, never to the edge */
.strip{display:flex;justify-content:center;gap:2.6%;padding-block:var(--space-8)} .strip svg{width:min(6.5%,52px);height:auto;fill:var(--pattern-ink);opacity:var(--pattern-opacity)}
/* booking widget */
.booking{background:var(--surface-raised);padding:var(--space-8) var(--space-4)}
.booking form{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:var(--space-4);align-items:end}
.field{display:flex;flex-direction:column;gap:var(--space-1);min-width:0} .field label{font:var(--label) var(--font-latin);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)}
[dir=rtl] .field label{font-family:var(--font-arabic);letter-spacing:0}
.field input,.field select{font:inherit;padding:10px 12px;border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:var(--radius-sm);min-width:0}
.field input:focus-visible,.field select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.note{color:var(--ink-muted);font-size:14px;margin:var(--space-4) 0 0}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-4)} .stat{border-top:2px solid var(--accent);padding-top:var(--space-4)}
.stat b{display:block;font-size:40px;line-height:44px;font-weight:400;color:var(--accent);font-variant-numeric:tabular-nums} .stat span{color:var(--ink-muted)}
/* footer */
footer{background:var(--deafah-black);color:#FFFFFF;padding-block:var(--space-16) var(--space-8)}
footer .wrap{display:grid;gap:var(--space-8)} footer .logo svg{height:52px;width:auto}
footer .strip svg{fill:var(--gold-gradient-start);opacity:.35} footer .strip{padding-block:var(--space-4)}
footer address{font-style:normal;color:var(--deafah-grey);line-height:1.8} footer bdi{unicode-bidi:isolate}
footer small{color:var(--deafah-grey);display:block}
@media (max-width:900px){.hero .wrap{grid-template-columns:1fr}.cards,.stats{grid-template-columns:1fr 1fr}.booking form{grid-template-columns:1fr 1fr}.nav ul{display:none}}
@media (max-width:520px){.cards,.stats,.booking form{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}}
